# SP1 guest + host. Own workspace (excluded from the root members).
# Proves `clearing::ExecutingProver` inside the zkVM.
[workspace]
members = ["program", "script"]
resolver = "2"

# SP1 precompiles. In the zkVM (RISC-V) build these replace expensive in-VM
# computation with syscalls, cutting cycles sharply; on the native host build the
# patched crates fall back to their normal software implementations.
#
# - sha2: accelerates SHA-256 (the commitment hash) AND SHA-512 (used inside
#   ed25519 signature verification).
# - curve25519-dalek: accelerates the ed25519 curve arithmetic — the bulk of the
#   cost of the three signature checks per authenticated trade.
[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-6.0.0" }
curve25519-dalek = { git = "https://github.com/sp1-patches/curve25519-dalek", tag = "patch-4.1.3-sp1-6.0.0" }
