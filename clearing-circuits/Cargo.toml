# Custom ZK circuits (arkworks, Groth16 over BN254) — the "Lighter-style" path.
# Its own workspace, excluded from the orderlib workspace (see ../Cargo.toml).
# Slice 1: a Merkle-inclusion circuit. Small Groth16 circuits prove in
# milliseconds, so this is laptop-safe (unlike the SP1 zkVM prover).
[workspace]

[package]
name = "clearing-circuits"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-bn254 = "0.5"
ark-crypto-primitives = { version = "0.5", features = ["sponge", "r1cs"] }
ark-ec = "0.5"
ark-ff = "0.5"
ark-relations = "0.5"
ark-r1cs-std = "0.5"
ark-groth16 = "0.5"
ark-snark = "0.5"
ark-std = "0.5"
ark-ed-on-bn254 = { version = "0.5", features = ["r1cs"] }
